name: Build and Push Microservices to Docker Hub

on:
  push:
    branches: [ Main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build All JARs
        run: |
          mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push API Gateway
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest ./api-gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest

      - name: Build and Push Discovery Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/discovery-service:latest ./discovery-service
          docker push ${{ secrets.DOCKER_USERNAME }}/discovery-service:latest

      - name: Build and Push Product Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/product-service:latest ./product-service
          docker push ${{ secrets.DOCKER_USERNAME }}/product-service:latest

      - name: Build and Push Order Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/order-service:latest ./order-service
          docker push ${{ secrets.DOCKER_USERNAME }}/order-service:latest

      - name: Build and Push Inventory Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/inventory-service:latest ./inventory-service
          docker push ${{ secrets.DOCKER_USERNAME }}/inventory-service:latest

      - name: Build and Push Notification Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/notification-service:latest ./notification-service
          docker push ${{ secrets.DOCKER_USERNAME }}/notification-service:latest
