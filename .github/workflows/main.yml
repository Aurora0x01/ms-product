name: Build and Push Microservices to Docker Hub

on:
  push:
    branches: [ Main ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-push:
    name: Build and Push Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build All JARs
        run: |
          mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push API Gateway
        working-directory: api-gateway
        run: |
          docker build -t $DOCKER_USERNAME/api-gateway:latest .
          docker push $DOCKER_USERNAME/api-gateway:latest

      - name: Build and Push Discovery Service
        working-directory: discovery-service
        run: |
          docker build -t $DOCKER_USERNAME/discovery-service:latest .
          docker push $DOCKER_USERNAME/discovery-service:latest

      - name: Build and Push Product Service
        working-directory: product-service
        run: |
          docker build -t $DOCKER_USERNAME/product-service:latest .
          docker push $DOCKER_USERNAME/product-service:latest

      - name: Build and Push Order Service
        working-directory: order-service
        run: |
          docker build -t $DOCKER_USERNAME/order-service:latest .
          docker push $DOCKER_USERNAME/order-service:latest

      - name: Build and Push Inventory Service
        working-directory: inventory-service
        run: |
          docker build -t $DOCKER_USERNAME/inventory-service:latest .
          docker push $DOCKER_USERNAME/inventory-service:latest

      - name: Build and Push Notification Service
        working-directory: notification-service
        run: |
          docker build -t $DOCKER_USERNAME/notification-service:latest .
          docker push $DOCKER_USERNAME/notification-service:latest
